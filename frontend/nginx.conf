# Host reverse proxy terminates TLS; this Nginx forwards /api/ privately.
map $http_x_forwarded_proto $islamtrove_proto {
    default $scheme;
    http    http;
    https   https;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Docker DNS can resolve backend after its independent CI deployment.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        set $islamtrove_backend http://islamtrove_backend:8000;
        proxy_pass $islamtrove_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $islamtrove_proto;
        # Strip caller-supplied X-Forwarded-For before Uvicorn proxy handling.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        client_max_body_size 1m;
    }

    location = /stream-cache-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
